<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>하루의 조각 · 일기장</title><link rel="stylesheet" href="styles.css"></head><body>
<header><a href="/">← 수업의 서랍</a><span>MY PRIVATE JOURNAL</span><span class="badge">● 로컬 폴더에 저장</span></header>
<main><section class="intro"><span class="eyebrow">COLLECT THE LITTLE MOMENTS</span><h1>하루의 <em>조각.</em></h1><p>평범한 오늘도, 기록하면 나만의 이야기가 됩니다.</p></section>
<div class="workspace"><aside><div class="shelf-head"><h2>나의 기록 <small id="count">0</small></h2><button id="new">+ 오늘 쓰기</button></div><label for="search">기록 검색</label><input id="search" type="search" placeholder="제목이나 내용으로 찾기"><label for="month">월별 모아보기</label><input id="month" type="month"><button id="reset" class="quiet">필터 초기화</button><div id="list" aria-label="일기 목록"></div></aside>
<section class="paper"><div class="paper-top"><span>DEAR, MY DAY</span><span id="saved">새로운 이야기</span></div><form id="editor"><div class="date-row"><div><label for="date">기록할 날짜</label><input id="date" type="date" required></div><div><label for="mood">오늘의 마음</label><select id="mood"><option value="happy">☀ 행복해요</option><option value="calm">☘ 평온해요</option><option value="normal">◯ 보통이에요</option><option value="sad">☂ 슬퍼요</option><option value="tired">☾ 지쳤어요</option></select></div></div><label for="title">오늘을 한 문장으로</label><input id="title" maxlength="120" placeholder="어떤 하루를 보냈나요?"><label for="body">오늘의 이야기</label><textarea id="body" maxlength="100000" required placeholder="기억하고 싶은 순간, 떠오르는 생각을 편하게 적어보세요."></textarea><div class="paper-bottom"><span id="length">0자</span><div><button type="button" id="delete" class="quiet" hidden>일기 삭제</button><button type="submit" id="save" class="primary">기록 저장 ↗</button></div></div></form><p id="status" role="status" aria-live="polite"></p></section></div>
<footer>작은 기록이 쌓이는 나만의 공간. <span>저장 위치: teacher-hub / data / diary.sqlite</span></footer></main><script src="app.js" defer></script></body></html>
